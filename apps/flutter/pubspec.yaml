# SPDX-License-Identifier: Apache-2.0
name: wispnet
description: Shared Wispnet interface, matching the Android application.
publish_to: none
version: 0.1.0+1000
environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'
dependencies:
  desktop_drop: 0.9.2
  zxing2: 0.2.4
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  cross_file_io: 1.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
